<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratidão Sonora</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:15px}
.titulo{color:#FFD700;font-size:28px;font-weight:bold;margin:20px 0}
.btn-top{border:none;padding:12px 18px;border-radius:25px;font-weight:bold;cursor:pointer;margin:5px;font-size:14px}
.btn-branco{background:#fff;color:#000}
.btn-borda{background:#1a1a1a;color:#FFD700;border:1px solid #FFD700}
.btn-cinza{background:#333;color:#fff}
.btn-add{background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;padding:14px 22px}
.card{background:#111;border:1px solid #333;border-radius:20px;padding:15px;margin:12px 0}
audio{width:100%;margin-top:10px}
</style>
</head>
<body>

<div class="titulo">🙏 Gratidão Sonora</div>

<div>
<!-- BOTÃO BANCO -> VAI PRO BANCO GRATIDÃO -->
<button class="btn-top btn-branco" onclick="window.location.href='https://bancogratidaooficial-ops.github.io/BANCO-GRATIDAO/'">🏦 Banco</button>

<button class="btn-top btn-borda">✨ Gratidão</button>
<button class="btn-top btn-cinza">▶️ Tocar</button>

<!-- BOTÃO NOVO BEM-VINDO -> VAI PRO REPOSITÓRIO BEM-VINDO -->
<button class="btn-top btn-branco" onclick="window.location.href='https://bancogratidaooficial-ops.github.io/bem-vindo/'">👋 Bem-vindo</button>

<br>
<button class="btn-top btn-add" onclick="document.getElementById('fileInput').click()">+ 🎵 Add Música</button>
<input type="file" id="fileInput" accept="audio/*" multiple style="display:none">
</div>

<div id="listaAdd"></div>

<div class="card">
<b>Musica 1</b>
<audio controls src="musica1.mp3"></audio>
</div>
<div class="card">
<b>Musica 2</b>
<audio controls src="musica2.mp3"></audio>
</div>
<div class="card">
<b>Musica 3</b>
<audio controls src="musica3.mp3"></audio>
</div>
<div class="card">
<b>Musica 4 - Gratidão pela Vida</b>
<audio controls src="musica4.mp3"></audio>
</div>

<script>
const input = document.getElementById('fileInput');
const lista = document.getElementById('listaAdd');
input.addEventListener('change', function(){
 for(let f of this.files){
  let url = URL.createObjectURL(f);
  let div = document.createElement('div');
  div.className='card';
  div.innerHTML=`<b>🎵 ${f.name}</b><br><audio controls src="${url}"></audio>`;
  lista.appendChild(div);
 }
});
</script>
</body>
</html>
